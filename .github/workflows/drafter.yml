name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    uses: juftin/release-drafter/.github/workflows/workflow.yml@main
    with:
      config-name: preset:gitmoji
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
