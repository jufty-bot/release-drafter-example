name: Release Drafter Autolabeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  autolabeler:
    runs-on: ubuntu-latest
    steps:
      - uses: juftin/release-drafter/autolabeler@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
